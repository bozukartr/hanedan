name: Update via pull request

on:
  push:
    branches-ignore: [main]

permissions: {}
concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TITLE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          ahead=$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .ahead_by)
          if [[ "$ahead" == 0 ]]; then exit 0; fi
          number=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$number" ]]; then
            title=$(head -n 1 <<< "$TITLE" | cut -c 1-180)
            url=$(gh pr create --head "$BRANCH" --base main --title "${title:-$BRANCH}" --body "Bu güncelleme testler geçince otomatik birleştirilir.")
            number=${url##*/}
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

  test:
    needs: open
    if: needs.open.outputs.number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ needs.open.outputs.number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - run: test "$(git rev-parse HEAD^2)" = "$GITHUB_SHA"
      - run: npm test

  merge:
    needs: [open, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ needs.open.outputs.number }}
        run: |
          set -euo pipefail
          if [[ $(gh pr view "$NUMBER" --json isDraft --jq .isDraft) == true ]]; then exit 0; fi
          gh api -X PUT "repos/$GH_REPO/pulls/$NUMBER/merge" -f sha="$GITHUB_SHA" -f merge_method=squash --jq .merged | grep -qx true
          gh workflow run pages.yml --ref main
